[develop]
script_dir=$base/lib/usar_bringup
[install]
install_scripts=$base/lib/usar_bringup
[tool:pytest]
# ament_flake8 lanza procesos con fork() después de que otras pruebas importaran bibliotecas con
# hilos (launch, OpenCV). Python 3.12 lo advierte, pero flake8 solo lee archivos: es inofensivo.
filterwarnings =
    ignore:This process .* is multi-threaded, use of fork\(\) may lead to deadlocks:DeprecationWarning
