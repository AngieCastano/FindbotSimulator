# Parámetros de Nav2 para findbot (Capa 3). Robot diferencial, radio 0.30 m (físico 0.25 + margen).
# Explicación de cada elección: docs/fase3_parametros_nav.md

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.5

    # Rotation Shim: gira en el sitio hasta alinearse con la ruta y luego cede el control a RPP.
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.785          # >45° de desalineación → girar en el sitio
      angular_disengage_threshold: 0.3925    # <22.5° → pasar el control a RPP
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 2.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      # --- Regulated Pure Pursuit ---
      desired_linear_vel: 0.35
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.5
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 2.0     # = cost_scaling_factor de la capa de inflado
      use_rotate_to_heading: false           # lo hace el Rotation Shim
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0                 # también alimenta la "memoria" del collision_monitor
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.30
      # El LiDAR y la cámara van en capas separadas: si compartieran capa, los rayos del LiDAR
      # (plano a 0.18 m) borrarían los obstáculos bajos que solo ve la cámara (extremidades de
      # víctimas a 0.07–0.14 m).
      plugins: ["obstacle_layer", "depth_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 0.8
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
      depth_layer:
        # Rejilla 3D: un rayo de la cámara solo borra los vóxeles que atraviesa, de modo que los
        # rayos que pasan por encima de una extremidad no la eliminan.
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 10
        max_obstacle_height: 0.5
        mark_threshold: 0
        observation_sources: depth
        depth:
          topic: /camera/depth/points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.05            # descarta el suelo
          max_obstacle_height: 0.5
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.70
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.30
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "depth_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 0.8
          obstacle_max_range: 4.5
          raytrace_max_range: 5.0
      depth_layer:
        # Igual que en el costmap local (rejilla 3D, solo la cámara).
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 10
        max_obstacle_height: 0.5
        mark_threshold: 0
        observation_sources: depth
        depth:
          topic: /camera/depth/points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.05            # descarta el suelo
          max_obstacle_height: 0.5
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.70
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true                    # planifica a través de zona desconocida (exploración)
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0            # prefiere el centro de los pasillos
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.4, 0.0, 1.0]            # por debajo de los límites del DiffDrive (0.5, 1.5)
    min_velocity: [-0.2, 0.0, -1.0]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  # Filtro de seguridad de Nav2: velocity_smoother → cmd_vel_smoothed → (aquí) → cmd_vel.
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 1.0                    # sin datos recientes de sensores → detiene el robot
    base_shift_correction: true
    stop_pub_timeout: 1.0
    # Zona de parada que depende del sentido del movimiento (medidas desde base_footprint, centro
    # de giro; el chasis ocupa x ∈ [-0.25, 0.15] m e y ∈ [-0.15, 0.15] m, las ruedas llegan a ±0.25 m).
    # Si un obstáculo queda pegado delante, el robot aún puede girar o retroceder para salir.
    polygons: ["VelocityPolygonStop"]
    VelocityPolygonStop:
      type: "velocity_polygon"
      action_type: "stop"
      min_points: 3                        # puntos necesarios para considerar un obstáculo (ruido)
      visualize: true
      polygon_pub_topic: "collision_polygon"
      enabled: true
      holonomic: false
      velocity_polygons: ["rotation", "forward", "backward", "stopped"]
      rotation:                            # giro en el sitio: círculo que barre la carcasa (0.29 m)
        points: "[[0.31, 0.0], [0.22, 0.22], [0.0, 0.31], [-0.22, 0.22], [-0.31, 0.0], [-0.22, -0.22], [0.0, -0.31], [0.22, -0.22]]"
        linear_min: -0.02
        linear_max: 0.02
        theta_min: -2.0
        theta_max: 2.0
      # 0.30 m por delante del frontal: la frenada (≈ 0.18 m a 0.5 m/s) termina con el obstáculo aún
      # dentro del campo de la cámara, que no ve a menos de 0.05 m de su lente (x < 0.205 m).
      forward:
        points: "[[0.45, 0.27], [0.45, -0.27], [0.10, -0.27], [0.10, 0.27]]"
        linear_min: 0.02
        linear_max: 1.0
        theta_min: -2.0
        theta_max: 2.0
      backward:                            # 0.15 m por detrás de la parte trasera
        points: "[[-0.15, 0.27], [-0.15, -0.27], [-0.40, -0.27], [-0.40, 0.27]]"
        linear_min: -1.0
        linear_max: -0.02
        theta_min: -2.0
        theta_max: 2.0
      stopped:                             # sin movimiento: no hay nada que detener
        points: "[[0.01, 0.01], [0.01, -0.01], [-0.01, -0.01], [-0.01, 0.01]]"
        linear_min: -1.0
        linear_max: 1.0
        theta_min: -2.0
        theta_max: 2.0
    observation_sources: ["scan", "depth", "memory"]
    memory:
      # Obstáculos recordados por el costmap local (costmap_obstacle_cloud): cubren el punto
      # ciego junto al frontal, donde ni el LiDAR ni la cámara ven las extremidades.
      type: "pointcloud"
      topic: "/local_costmap/obstacle_points"
      min_height: 0.05
      max_height: 0.5
      use_global_height: false
      enabled: true
    scan:
      type: "scan"
      topic: "/scan"
      enabled: true
    depth:
      # Nube de la cámara: detecta las extremidades de las víctimas, bajo el plano del LiDAR.
      type: "pointcloud"
      topic: "/camera/depth/points"
      min_height: 0.05                     # descarta el suelo
      max_height: 0.5
      use_global_height: false
      enabled: true

collision_monitor_teleop:
  # Mismo filtro para la teleoperación: teleop → cmd_vel_teleop → (aquí) → cmd_vel.
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_teleop"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_teleop_state"
    transform_tolerance: 0.5
    source_timeout: 1.0                    # sin datos recientes de sensores → detiene el robot
    base_shift_correction: true
    stop_pub_timeout: 1.0
    # Zona de parada que depende del sentido del movimiento (medidas desde base_footprint, centro
    # de giro; el chasis ocupa x ∈ [-0.25, 0.15] m e y ∈ [-0.15, 0.15] m, las ruedas llegan a ±0.25 m).
    # Si un obstáculo queda pegado delante, el robot aún puede girar o retroceder para salir.
    polygons: ["VelocityPolygonStop"]
    VelocityPolygonStop:
      type: "velocity_polygon"
      action_type: "stop"
      min_points: 3                        # puntos necesarios para considerar un obstáculo (ruido)
      visualize: true
      polygon_pub_topic: "collision_polygon"
      enabled: true
      holonomic: false
      velocity_polygons: ["rotation", "forward", "backward", "stopped"]
      rotation:                            # giro en el sitio: círculo que barre la carcasa (0.29 m)
        points: "[[0.31, 0.0], [0.22, 0.22], [0.0, 0.31], [-0.22, 0.22], [-0.31, 0.0], [-0.22, -0.22], [0.0, -0.31], [0.22, -0.22]]"
        linear_min: -0.02
        linear_max: 0.02
        theta_min: -2.0
        theta_max: 2.0
      # 0.30 m por delante del frontal: la frenada (≈ 0.18 m a 0.5 m/s) termina con el obstáculo aún
      # dentro del campo de la cámara, que no ve a menos de 0.05 m de su lente (x < 0.205 m).
      forward:
        points: "[[0.45, 0.27], [0.45, -0.27], [0.10, -0.27], [0.10, 0.27]]"
        linear_min: 0.02
        linear_max: 1.0
        theta_min: -2.0
        theta_max: 2.0
      backward:                            # 0.15 m por detrás de la parte trasera
        points: "[[-0.15, 0.27], [-0.15, -0.27], [-0.40, -0.27], [-0.40, 0.27]]"
        linear_min: -1.0
        linear_max: -0.02
        theta_min: -2.0
        theta_max: 2.0
      stopped:                             # sin movimiento: no hay nada que detener
        points: "[[0.01, 0.01], [0.01, -0.01], [-0.01, -0.01], [-0.01, 0.01]]"
        linear_min: -1.0
        linear_max: 1.0
        theta_min: -2.0
        theta_max: 2.0
    observation_sources: ["scan", "depth", "memory"]
    memory:
      # Obstáculos recordados por el costmap local (costmap_obstacle_cloud): cubren el punto
      # ciego junto al frontal, donde ni el LiDAR ni la cámara ven las extremidades.
      type: "pointcloud"
      topic: "/local_costmap/obstacle_points"
      min_height: 0.05
      max_height: 0.5
      use_global_height: false
      enabled: true
    scan:
      type: "scan"
      topic: "/scan"
      enabled: true
    depth:
      # Nube de la cámara: detecta las extremidades de las víctimas, bajo el plano del LiDAR.
      type: "pointcloud"
      topic: "/camera/depth/points"
      min_height: 0.05                     # descarta el suelo
      max_height: 0.5
      use_global_height: false
      enabled: true

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    node_names: ["controller_server", "planner_server", "behavior_server",
                 "velocity_smoother", "collision_monitor", "collision_monitor_teleop",
                 "bt_navigator"]
    bond_timeout: 4.0

costmap_obstacle_cloud:
  ros__parameters:
    costmap_topic: /local_costmap/costmap
    cloud_topic: /local_costmap/obstacle_points
    lethal_value: 100                      # OccupancyGrid: 100 = celda letal (obstáculo real)
    point_height: 0.1                      # dentro de la banda de altura del collision_monitor
