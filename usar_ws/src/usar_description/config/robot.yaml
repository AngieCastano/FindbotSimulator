# Parámetros físicos y de sensores del robot diferencial "findbot".
# Longitudes en m, masas en kg, ángulos en rad, frecuencias en Hz.
# El xacro (urdf/findbot.urdf.xacro) lee este archivo: no hay valores fijos en el URDF.

chassis:
  length: 0.40          # eje x
  width: 0.30           # eje y
  height: 0.12
  x_offset: -0.05       # centro del chasis respecto a base_link (el eje de ruedas va 5 cm por delante)
  z_offset: 0.03        # centro del chasis sobre base_link (base_link = eje de ruedas)
  mass: 5.0

wheels:
  radius: 0.08
  width: 0.04
  separation: 0.34      # distancia entre centros de rueda
  mass: 0.5
  friction: 1.0

caster:
  radius: 0.04
  x_offset: -0.19       # respecto a base_link (eje de ruedas)
  mass: 0.2

diff_drive:
  max_linear_velocity: 0.5
  max_angular_velocity: 1.5
  max_linear_acceleration: 1.0
  max_angular_acceleration: 2.0
  odom_publish_frequency: 30

lidar:                  # LiDAR 2D 360°
  x: 0.0
  z: 0.10               # sobre base_link → plano de escaneo a 0.18 m del suelo
  update_rate: 10
  samples: 360
  min_range: 0.12
  max_range: 12.0
  range_resolution: 0.01
  noise_stddev: 0.01    # ruido gaussiano (m)

camera:                 # cámara RGB-D frontal, en la cara delantera del chasis
  x: 0.155              # respecto a base_link: cara delantera del chasis (0.15 m)
  z: 0.04               # sobre base_link → 0.12 m del suelo (bajo el plano del LiDAR)
  pitch: 0.0
  update_rate: 15
  width: 640
  height: 480
  horizontal_fov: 1.2   # ~69°
  near: 0.05            # recorte cercano: ve obstáculos bajos casi pegados al frontal
  far: 10.0
  noise_stddev: 0.007

thermal:                # cámara térmica MLX90640 (versión BAA, 55° × 35°); fase 2: use_thermal:=true
  # Posición relativa a la cámara RGB-D como en el robot físico (hardware/CLAUDE.md, Geometría):
  # 6 cm a la derecha y 3 mm más abajo. Pendiente: alinear toda la geometría con el hardware.
  x: 0.155
  y: -0.06
  z: 0.037              # sobre base_link → 0.117 m del suelo
  pitch: 0.0
  update_rate: 4        # Hz (el MLX90640 admite 0.5–64 Hz; a más frecuencia, más ruido)
  width: 32
  height: 24
  horizontal_fov: 0.96  # 55°; Gazebo usa píxeles cuadrados: el vertical queda en ≈ 42° (real 35°)
  near: 0.1
  far: 20.0

co2:                    # sensor de CO₂ Figaro TGS4161 (fase 2: use_co2:=true)
  # Posición respecto a base_link tomada de hardware/CLAUDE.md (Geometría). Pendiente: alinear
  # toda la geometría del robot simulado con el hardware.
  x: 0.03
  y: 0.05
  z: 0.0275

mic_array:              # ReSpeaker USB Mic Array v2.0 (fase 2: use_sound:=true)
  # Posición respecto a base_link tomada de hardware/CLAUDE.md (Geometría). Pendiente: alinear
  # toda la geometría del robot simulado con el hardware.
  x: -0.12
  y: 0.0
  z: 0.0835
