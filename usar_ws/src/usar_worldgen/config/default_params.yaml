# Parámetros θ por defecto del generador procedural E = G(θ, s).
# Uso: ros2 run usar_worldgen generate --params <este archivo> --seed 42
# Longitudes en metros, ángulos en radianes. Los argumentos de la CLI tienen prioridad.

seed: 42
size: [20.0, 20.0]              # ancho (x) y largo (y) del área interior
n_obstacles: 40
obstacle_size_range: [0.3, 2.0] # lado de cajas / diámetro de cilindros
obstacle_height_range: [0.4, 1.5]  # mínimo > altura del LiDAR para que sean visibles
box_ratio: 0.6                  # fracción de cajas (resto: cilindros)
min_gap: 0.05                   # separación mínima entre objetos
n_victims: 5
robot_spawn: [0.0, 0.0, 0.0]    # x, y, yaw
spawn_clearance: 1.0            # zona libre alrededor del spawn
robot_radius: 0.30              # = robot_radius de Nav2 (radio físico 0.25 m + 5 cm de margen)
grid_resolution: 0.05           # igual a la resolución del /map de slam_toolbox
victim_reach_distance: 1.0      # distancia máx. desde zona alcanzable a la víctima
victim_appearance: orange       # orange (MVP) | dusty (grises "cubiertas de polvo")
n_low_debris: 0                 # escombros bajos (tablones, losas, bloques); 0 = mundo del MVP
low_debris_height_range: [0.08, 0.28]  # alturas parecidas a las de una víctima (≈ 0.22 m)
ambient_temperature_c: 20.0     # suelo, muros y escombros (cámara térmica, Fase 9)
victim_temperature_c: 34.0      # superficie de una persona vestida (no los 37 °C internos)
n_warm_debris: 0                # escombros tibios (falsos positivos térmicos); 0 = ninguno
warm_debris_temperature_range: [28.0, 45.0]  # °C: sol, tuberías, motores
wall_height: 1.0
wall_thickness: 0.2
max_attempts: 50                # reintentos con sub-semilla
max_placement_tries: 2000       # intentos de colocación por objeto
