# Variante "demo": escenario pequeño para ver el funcionamiento en pantalla (no para medir).
# 10 × 10 m con el robot en el centro: las víctimas quedan a pocos metros y los sensores las
# alcanzan enseguida. El robot empieza sin mapa (SLAM lo construye al explorar). Víctimas grises
# como los escombros: el color no sirve, las detectan los signos de vida (calor, CO₂, radar,
# sonido) y la forma.
# Uso: ros2 launch usar_bringup mission.launch.py seed:=2 world_params:=demo use_thermal:=true \
#        use_co2:=true use_sound:=true use_radar:=true [camera_detection:=false]
size: [10.0, 10.0]
n_obstacles: 10               # pocos escombros: se ve bien el recorrido
n_victims: 3
victim_appearance: dusty      # grises "cubiertas de polvo": sin color distintivo
