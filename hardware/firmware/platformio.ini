; Firmware del ESP32 del robot "findbot". Los valores del robot NO van aquí: están en
; hardware/config/robot_hw.yaml y tools/gen_config.py los convierte en include/config_gen.h.
;
; Entornos:
;   esp32        firmware del robot: micro-ROS por USB serial (H6)
;   esp32_e2e    esp32 en un dominio DDS aislado (prueba de punta a punta con Wokwi)
;   esp32_debug  mismo control, pero con mandos y telemetría de texto (H4/H5, pruebas en Wokwi)
;   native       pruebas unitarias en el PC

[platformio]
default_envs = esp32

[env]
extra_scripts = pre:tools/pio_pre.py

[esp32_base]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
; debe coincidir con mcu.usb_serial_baud (lo verifica tools/gen_config.py --check)
monitor_speed = 921600
build_unflags = -std=gnu++11
build_src_flags = -Wall -Wextra -Werror
test_ignore = *

[env:esp32]
extends = esp32_base
build_flags = -std=gnu++17 -DFINDBOT_MICROROS=1
board_microros_distro = jazzy
board_microros_transport = serial
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio

; Igual que esp32 pero en el dominio DDS aislado firmware.ros.e2e_domain_id: la prueba de punta a
; punta nunca se mezcla con la simulación de Gazebo (dominio 0).
[env:esp32_e2e]
extends = env:esp32
build_flags = -std=gnu++17 -DFINDBOT_MICROROS=1 -DFINDBOT_ROS_DOMAIN_E2E=1

[env:esp32_debug]
extends = esp32_base
build_flags = -std=gnu++17 -DFINDBOT_MICROROS=0
lib_ignore = micro_ros_platformio

[env:native]
platform = native
test_framework = unity
; UNITY_INCLUDE_DOUBLE: sin esto las aserciones TEST_ASSERT_*_DOUBLE no verifican nada
build_flags = -std=gnu++17 -Wall -Wextra -Werror -lm -DUNITY_INCLUDE_DOUBLE
