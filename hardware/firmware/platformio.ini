; Firmware del ESP32 del robot "findbot". Los valores del robot NO van aquí: están en
; hardware/config/robot_hw.yaml y tools/gen_config.py los convierte en include/config_gen.h.

[platformio]
default_envs = esp32

[env]
extra_scripts = pre:tools/pio_pre.py

[env:esp32]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
; debe coincidir con mcu.usb_serial_baud (lo verifica tools/gen_config.py --check)
monitor_speed = 921600
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
build_src_flags = -Wall -Wextra -Werror
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -Werror -lm
